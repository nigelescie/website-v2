<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/LOGO.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/LOGO.png">
    <link rel="shortcut icon" href="assets/LOGO.png">
    <title>Vision Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .debug-section {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px 0;
        }

        .test-image {
            max-width: 300px;
            border: 1px solid #ddd;
            margin: 10px 0;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        .localStorage-data {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <h1>Vision Image Debug Tool</h1>

    <div class="debug-section">
        <h2>Current localStorage Data</h2>
        <button onclick="checkLocalStorage()">Check localStorage</button>
        <div id="localStorage-display" class="localStorage-data"></div>
    </div>

    <div class="debug-section">
        <h2>Test Vision Image Upload</h2>
        <input type="file" id="test-upload" accept="image/*" onchange="testUpload(this)">
        <div id="upload-result"></div>
    </div>

    <div class="debug-section">
        <h2>Test Image Display</h2>
        <div id="test-display">
            <p>No image to display</p>
        </div>
    </div>

    <div class="debug-section">
        <h2>Simulate Company Page Loading</h2>
        <button onclick="simulateCompanyPageLoad()">Simulate Load</button>
        <div id="simulation-result"></div>
    </div>

    <div class="debug-section">
        <h2>Clear Data</h2>
        <button onclick="clearVisionData()">Clear Vision Data</button>
    </div>

    <script>
        function checkLocalStorage() {
            const visionData = localStorage.getItem('escience_vision');
            const display = document.getElementById('localStorage-display');

            if (visionData) {
                try {
                    const parsed = JSON.parse(visionData);
                    display.innerHTML = `
                        <h3>Vision Data Found:</h3>
                        <pre>${JSON.stringify(parsed, null, 2)}</pre>
                        ${parsed.imageUrl ? `<img src="${parsed.imageUrl}" class="test-image" alt="Vision image">` : '<p>No image URL found</p>'}
                    `;
                } catch (e) {
                    display.innerHTML = `<p>Error parsing vision data: ${e.message}</p>`;
                }
            } else {
                display.innerHTML = '<p>No vision data found in localStorage</p>';
            }
        }

        function testUpload(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();

                reader.onload = function (e) {
                    const imageUrl = e.target.result;
                    const visionData = {
                        title: "Test Vision",
                        content: "Test vision content",
                        imageUrl: imageUrl
                    };

                    localStorage.setItem('escience_vision', JSON.stringify(visionData));

                    document.getElementById('upload-result').innerHTML = `
                        <p>✅ Image uploaded and saved to localStorage</p>
                        <img src="${imageUrl}" class="test-image" alt="Uploaded">
                    `;

                    checkLocalStorage();
                };

                reader.readAsDataURL(file);
            }
        }

        function simulateCompanyPageLoad() {
            const savedVision = localStorage.getItem('escience_vision');
            const result = document.getElementById('simulation-result');

            if (savedVision) {
                try {
                    const visionData = JSON.parse(savedVision);

                    // Simulate the company page logic
                    let visionSection = null;
                    const testDiv = document.createElement('div');
                    testDiv.innerHTML = `
                        <div class="why-section">
                            <div class="content-split company-content-split">
                                <div class="split-image-container">
                                    <img src="../assets/vision-img.jpeg" alt="Vision" class="split-image">
                                </div>
                                <div class="split-content-container bg-blue text-white">
                                    <h2 class="section-title">Vision</h2>
                                    <p class="section-text">Default content</p>
                                </div>
                            </div>
                        </div>
                    `;

                    visionSection = testDiv.querySelector('.content-split.company-content-split');

                    if (visionSection && visionData.imageUrl) {
                        const visionImage = visionSection.querySelector('.split-image');
                        if (visionImage) {
                            visionImage.src = visionData.imageUrl;
                            visionImage.alt = visionData.title || 'Vision';

                            result.innerHTML = `
                                <p>✅ Simulation successful! Image would be updated to:</p>
                                <img src="${visionData.imageUrl}" class="test-image" alt="Vision">
                                <p><strong>Updated src:</strong> ${visionData.imageUrl.substring(0, 50)}...</p>
                            `;
                        } else {
                            result.innerHTML = '<p>❌ Could not find vision image element</p>';
                        }
                    } else {
                        result.innerHTML = '<p>❌ Could not find vision section or no imageUrl</p>';
                    }
                } catch (e) {
                    result.innerHTML = `<p>❌ Error: ${e.message}</p>`;
                }
            } else {
                result.innerHTML = '<p>❌ No vision data found in localStorage</p>';
            }
        }

        function clearVisionData() {
            localStorage.removeItem('escience_vision');
            document.getElementById('localStorage-display').innerHTML = '<p>Vision data cleared</p>';
            document.getElementById('upload-result').innerHTML = '';
            document.getElementById('simulation-result').innerHTML = '';
        }

        // Auto-check on load
        window.onload = function () {
            checkLocalStorage();
        };
    </script>
</body>

</html>
